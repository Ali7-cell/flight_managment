[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flight_domain"
version = "0.1.0"
description = "Shared flight domain logic and models"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "python-dateutil>=2.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
