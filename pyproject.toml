[project]
name = "flight-management-system"
version = "0.1.0"
description = "Production-ready Flight Management System backend"
authors = [{ name = "Flight Operations Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "langgraph>=0.2.14",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "pinecone>=5.0.0",
    "stripe>=10.0.0",
    "pyjwt[crypto]>=2.9.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "cryptography>=43.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "packages/flight_domain"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyright]
extraPaths = [
    "packages/flight_domain",
    ".",
    "apps/worker",
    "apps/api"
]
include = [
    "apps",
    "packages",
    "tests"
]
reportMissingImports = "none"

