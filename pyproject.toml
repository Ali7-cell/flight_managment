[project]
name = "flight-management-system"
version = "0.1.0"
description = "Production-ready Flight Management System"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "langgraph>=0.2.14",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "pinecone>=5.0.0",
    "stripe>=10.0.0",
    "pyjwt[crypto]>=2.9.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "cryptography>=43.0.0"
]

[tool.fastapi]
entrypoint = "main:app"
